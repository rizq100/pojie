<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Pelawat</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#fff0d9,#ffd8a8,#ffb36b);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    overflow:hidden;
}

/* Background bulat */
.circle1{
    position:absolute;
    width:350px;
    height:350px;
    background:#ffb347;
    border-radius:50%;
    top:-100px;
    left:-80px;
    filter:blur(40px);
}

.circle2{
    position:absolute;
    width:300px;
    height:300px;
    background:#ffcc80;
    border-radius:50%;
    bottom:-80px;
    right:-70px;
    filter:blur(40px);
}

/* Kotak utama */
.container{
    position:relative;
    z-index:2;
    width:500px;
    max-width:100%;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(10px);
    padding:40px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

/* Tajuk */
.title{
    text-align:center;
    margin-bottom:30px;
}

.title h1{
    color:#ff7a00;
    margin-bottom:10px;
    font-size:36px;
}

.title p{
    color:#666;
}

/* Input */
.input-box{
    margin-bottom:20px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#444;
}

.input-box input,
.input-box select{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:#f3f3f3;
    font-size:15px;
}

.input-box input:focus,
.input-box select:focus{
    outline:none;
    background:white;
    box-shadow:0 0 8px rgba(255,122,0,0.3);
}

/* Button */
.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:linear-gradient(90deg,#ff7a00,#ffb347);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.03);
}

</style>
</head>

<body>

<div class="circle1"></div>
<div class="circle2"></div>

<div class="container">

    <div class="title">
        <h1>DAFTAR PELAWAT</h1>
        <p>Sila isi maklumat pelawat</p>
    </div>

    <div class="input-box">
        <label>Nama Pelawat</label>
        <input type="text" placeholder="Masukkan nama">
    </div>

    <div class="input-box">
        <label>Tujuan</label>
        <select>
            <option>Jumpa Guru</option>
            <option>Ambil Pelajar</option>
            <option>Penghantaran Barang</option>
            <option>Lain-lain</option>
        </select>
    </div>

    <div class="input-box">
        <label>Tempat</label>
        <input type="text" placeholder="Contoh: Pejabat Sekolah">
    </div>

    <div class="input-box">
        <label>Masa</label>
        <input type="time">
    </div>

    <button class="btn">
        HANTAR
    </button>

</div>

</body>
</html>
